# 真昔（PhotoManager）三平台自动打包
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.5.67）→ 构建 + 自动发布到该标签的 Release
#   2. Actions 页面手动 workflow_dispatch → 只构建，产物在 Artifacts 下载（不发布）
#
# 前置条件（一次性人工操作）：
#   在本仓库创建 tag models-v1 的 Release，上传三个文件（源码见 models/ 与 models/geo）：
#     - vit-b-16.img.fp32.onnx        CLIP 图像编码器（约 334MB）
#     - vit-b-16.txt.fp32.onnx        CLIP 文本编码器（约 393MB）
#     - geo.sqlite                    离线逆地理数据库（约 24MB，tools/build_geo.py 生成）
#   三平台的构建都会从这里自动拉取并合并进安装包。
#
# 产物对应关系：
#   windows  → PhotoManager-<版本>-win64.zip          （解压即用）
#   linux    → PhotoManager-<版本>-linux64.tar.gz     （Ubuntu 22.04 构建，需较新发行版）
#   kylin    → PhotoManager-<版本>-kylin-aarch64.tar.gz（银河麒麟 V10 / aarch64，glibc 2.31）

name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows x86_64 ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - name: 拉取离线模型（CLIP + geo）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force models/clip, models/geo | Out-Null
          gh release download models-v1 --repo lefteyewell/zhenxi --dir models-tmp --clobber
          Move-Item models-tmp/vit-b-16.img.fp32.onnx models/clip/
          Move-Item models-tmp/vit-b-16.txt.fp32.onnx models/clip/
          Move-Item models-tmp/geo.sqlite models/geo/
          foreach ($f in @('models/clip/vit-b-16.img.fp32.onnx', 'models/clip/vit-b-16.txt.fp32.onnx')) {
            if ((Get-Item $f).Length -lt 300MB) { throw "模型文件过小，下载失败: $f" }
          }
          if ((Get-Item models/geo/geo.sqlite).Length -lt 20MB) { throw 'geo.sqlite 过小，下载失败' }
          Get-ChildItem models/clip, models/geo | Select-Object Name, Length

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm photo_manager.spec

      - name: 体积裁剪
        env:
          PYTHONUTF8: '1'
        run: python tools/trim_package.py dist/PhotoManager

      - name: 冒烟自检
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\PhotoManager\PhotoManager.exe --smoke

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path photo_manager/__init__.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: 打 zip 包
        shell: pwsh
        run: Compress-Archive -Path dist/PhotoManager -DestinationPath "PhotoManager-${{ steps.ver.outputs.version }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: PhotoManager-*-win64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-win64.zip

  # ---------- Linux x86_64 ----------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Qt 运行系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - name: 拉取离线模型（CLIP + geo）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/clip models/geo
          gh release download models-v1 --repo lefteyewell/zhenxi --dir models-tmp --clobber
          mv models-tmp/vit-b-16.img.fp32.onnx models/clip/
          mv models-tmp/vit-b-16.txt.fp32.onnx models/clip/
          mv models-tmp/geo.sqlite models/geo/
          [ "$(stat -c%s models/clip/vit-b-16.img.fp32.onnx)" -gt 300000000 ] || { echo 'img.onnx 过小，下载失败'; exit 1; }
          [ "$(stat -c%s models/clip/vit-b-16.txt.fp32.onnx)" -gt 350000000 ] || { echo 'txt.onnx 过小，下载失败'; exit 1; }
          [ "$(stat -c%s models/geo/geo.sqlite)" -gt 20000000 ] || { echo 'geo.sqlite 过小，下载失败'; exit 1; }
          ls -l models/clip models/geo

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm photo_manager.spec

      - name: 体积裁剪
        run: python tools/trim_dist.py dist/PhotoManager

      # CI 无显示环境，offscreen 冒烟偶发环境性失败，不阻断发布
      - name: 冒烟自检（不阻断）
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/PhotoManager/PhotoManager --smoke

      - name: 读取版本号并打 tar 包
        id: ver
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('photo_manager/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          tar -czf "PhotoManager-${VER}-linux64.tar.gz" -C dist PhotoManager

      - uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: PhotoManager-*-linux64.tar.gz

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-linux64.tar.gz

  # ---------- 银河麒麟 V10 aarch64 ----------
  kylin:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # GitHub 无 aarch64/麒麟机器，用 QEMU 模拟（构建较慢，属正常现象）
      - uses: docker/setup-qemu-action@v3

      - name: 拉取离线模型（CLIP + geo，挂载进容器）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/clip models/geo
          gh release download models-v1 --repo lefteyewell/zhenxi --dir models-tmp --clobber
          mv models-tmp/vit-b-16.img.fp32.onnx models/clip/
          mv models-tmp/vit-b-16.txt.fp32.onnx models/clip/
          mv models-tmp/geo.sqlite models/geo/
          [ "$(stat -c%s models/clip/vit-b-16.img.fp32.onnx)" -gt 300000000 ] || { echo 'img.onnx 过小，下载失败'; exit 1; }
          [ "$(stat -c%s models/clip/vit-b-16.txt.fp32.onnx)" -gt 350000000 ] || { echo 'txt.onnx 过小，下载失败'; exit 1; }
          [ "$(stat -c%s models/geo/geo.sqlite)" -gt 20000000 ] || { echo 'geo.sqlite 过小，下载失败'; exit 1; }
          ls -l models/clip models/geo

      # python:3.11-slim-bullseye = glibc 2.31（麒麟 V10 兼容）+ Python 3.11（PySide6 6.12 可用）
      # 教训：bullseye 官方源最高 python3.9，PySide6 6.9+ 不支持 3.9，会静默装 6.8 导致真机启动即崩
      - name: 构建 aarch64 构建镜像
        run: >-
          docker build --platform linux/arm64
          --build-arg PY_IMAGE=python:3.11-slim-bullseye
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          -f tools/arm/kylin.Dockerfile -t pm-kylin .

      - name: 容器内 PyInstaller 打包
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            pm-kylin bash -c '
              set -e
              python -m PyInstaller --noconfirm \
                --distpath dist_arm --workpath build_arm \
                photo_manager.spec
              python tools/trim_dist.py dist_arm/PhotoManager
            '

      # 打包后必做冒烟自检：offscreen 启动全部 QML（QEMU 下较慢，给足超时）
      - name: 容器内冒烟自检（启动即崩将在此暴露）
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work/dist_arm/PhotoManager \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e QT_QPA_PLATFORM=offscreen \
            pm-kylin bash -c 'timeout 600 ./PhotoManager --smoke && echo SMOKE_OK'

      - name: 读取版本号并打 tar 包
        id: ver
        run: |
          VER=$(python3 -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('photo_manager/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          tar -czf "PhotoManager-${VER}-kylin-aarch64.tar.gz" -C dist_arm PhotoManager
          du -sh "PhotoManager-${VER}-kylin-aarch64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: kylin-targz
          path: PhotoManager-*-kylin-aarch64.tar.gz

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-kylin-aarch64.tar.gz
