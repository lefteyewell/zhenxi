# 真昔（PhotoManager）三平台自动打包
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.5.67）→ 构建 + 自动发布到该标签的 Release
#   2. Actions 页面手动 workflow_dispatch → 只构建，产物在 Artifacts 下载（不发布）
#
# 前置条件（一次性人工操作）：
#   在本仓库创建 tag models-v1 的 Release，上传三个文件（源码见 models/ 与 models/geo）：
#     - vit-b-16.img.fp32.onnx        CLIP 图像编码器（约 334MB）
#     - vit-b-16.txt.fp32.onnx        CLIP 文本编码器（约 393MB）
#     - geo.sqlite                    离线逆地理数据库（约 24MB，tools/build_geo.py 生成）
#   三平台的构建都会从这里自动拉取并合并进安装包。
#
# 产物对应关系：
#   windows  → PhotoManager-<版本>-win64.zip          （解压即用）
#   linux    → PhotoManager-<版本>-linux64.tar.gz     （Ubuntu 22.04 构建，需较新发行版）
#   kylin    → PhotoManager-<版本>-kylin-aarch64.tar.gz（银河麒麟 V10 / aarch64，glibc 2.31）

name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MODELS_BASE: https://github.com/lefteyewell/zhenxi/releases/download/models-v1

jobs:
  # ---------- Windows x86_64 ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - name: 拉取离线模型（CLIP + geo）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force models/clip, models/geo | Out-Null
          curl.exe -L --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -o models/clip/vit-b-16.img.fp32.onnx "$env:MODELS_BASE/vit-b-16.img.fp32.onnx"
          curl.exe -L --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -o models/clip/vit-b-16.txt.fp32.onnx "$env:MODELS_BASE/vit-b-16.txt.fp32.onnx"
          curl.exe -L --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -o models/geo/geo.sqlite "$env:MODELS_BASE/geo.sqlite"

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm photo_manager.spec

      - name: 体积裁剪
        run: python tools/trim_package.py dist/PhotoManager

      - name: 冒烟自检
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\PhotoManager\PhotoManager.exe --smoke

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path photo_manager/__init__.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: 打 zip 包
        shell: pwsh
        run: Compress-Archive -Path dist/PhotoManager -DestinationPath "PhotoManager-${{ steps.ver.outputs.version }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: PhotoManager-*-win64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-win64.zip

  # ---------- Linux x86_64 ----------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Qt 运行系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - name: 拉取离线模型（CLIP + geo）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/clip models/geo
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/clip/vit-b-16.img.fp32.onnx "$MODELS_BASE/vit-b-16.img.fp32.onnx"
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/clip/vit-b-16.txt.fp32.onnx "$MODELS_BASE/vit-b-16.txt.fp32.onnx"
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/geo/geo.sqlite "$MODELS_BASE/geo.sqlite"

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm photo_manager.spec

      - name: 体积裁剪
        run: python tools/trim_package.py dist/PhotoManager

      # CI 无显示环境，offscreen 冒烟偶发环境性失败，不阻断发布
      - name: 冒烟自检（不阻断）
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/PhotoManager/PhotoManager --smoke

      - name: 读取版本号并打 tar 包
        id: ver
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('photo_manager/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          tar -czf "PhotoManager-${VER}-linux64.tar.gz" -C dist PhotoManager

      - uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: PhotoManager-*-linux64.tar.gz

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-linux64.tar.gz

  # ---------- 银河麒麟 V10 aarch64 ----------
  kylin:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # GitHub 无 aarch64/麒麟机器，用 QEMU 模拟（构建较慢，属正常现象）
      - uses: docker/setup-qemu-action@v3

      - name: 拉取离线模型（CLIP + geo，挂载进容器）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/clip models/geo
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/clip/vit-b-16.img.fp32.onnx "$MODELS_BASE/vit-b-16.img.fp32.onnx"
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/clip/vit-b-16.txt.fp32.onnx "$MODELS_BASE/vit-b-16.txt.fp32.onnx"
          curl -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o models/geo/geo.sqlite "$MODELS_BASE/geo.sqlite"

      # 复用 tools/arm/kylin.Dockerfile（debian:bullseye glibc 2.31，与麒麟 V10 对齐）
      - name: 构建 aarch64 构建镜像
        run: docker build --platform linux/arm64 -f tools/arm/kylin.Dockerfile -t pm-kylin tools/arm

      - name: 容器内 PyInstaller 打包
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            pm-kylin bash -c '
              set -e
              python3.9 -m PyInstaller --noconfirm \
                --distpath dist_arm --workpath build_arm \
                photo_manager.spec
              python3.9 tools/trim_package.py dist_arm/PhotoManager
              tar -czf /work/PhotoManager-kylin-aarch64.tar.gz -C dist_arm PhotoManager
            '

      - name: 读取版本号并重命名
        id: ver
        run: |
          VER=$(python3 -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('photo_manager/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mv PhotoManager-kylin-aarch64.tar.gz "PhotoManager-${VER}-kylin-aarch64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: kylin-targz
          path: PhotoManager-*-kylin-aarch64.tar.gz

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoManager-*-kylin-aarch64.tar.gz
